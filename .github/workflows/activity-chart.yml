name: Update activity chart

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-chart
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test chart rendering
        run: node --test scripts/activity-chart.test.mjs

      - name: Render chart
        run: node scripts/update-activity-chart.mjs
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          # Optional classic PAT with read:user, so private contributions are counted.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/activity.svg; then
            echo "Activity chart unchanged"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg
          git commit -m 'Update activity chart'
          git push
