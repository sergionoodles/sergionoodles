<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Hello, I'm Sergio</title>
  <desc id="desc">A terminal window typing whoami, next to a steaming bowl of neon noodles.</desc>

  <defs>
    <style>
      .mono { font-family: 'Space Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .steam { fill: none; stroke: #826aed; stroke-width: 3; stroke-linecap: round; opacity: 0; animation: rise 3.6s ease-in-out infinite; }
      .steam.s2 { animation-delay: 1.2s; stroke: #4cc9f0; }
      .steam.s3 { animation-delay: 2.4s; }
      .lift { animation: lift 4s ease-in-out infinite; }
      .broth-noodle { animation: wobble 5s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes rise {
        0% { transform: translateY(14px); opacity: 0; }
        35% { opacity: 0.7; }
        100% { transform: translateY(-34px); opacity: 0; }
      }
      @keyframes lift {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-9px); }
      }
      @keyframes wobble {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(6px); }
      }
    </style>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.025" />
    </pattern>

    <radialGradient id="bowl-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f72585" stop-opacity="0.22" />
      <stop offset="1" stop-color="#f72585" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="noodle-gradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f72585" />
      <stop offset="0.5" stop-color="#826aed" />
      <stop offset="1" stop-color="#4cc9f0" />
    </linearGradient>

    <filter id="neon" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="above-broth">
      <rect x="760" y="0" width="340" height="266" />
    </clipPath>

    <clipPath id="broth-surface">
      <ellipse cx="930" cy="268" rx="128" ry="17" />
    </clipPath>

    <clipPath id="bowl-body">
      <path d="M790 270 Q 798 398 930 404 Q 1062 398 1070 270 Z" />
    </clipPath>

    <clipPath id="typed-command">
      <rect x="86" y="74" height="32" width="100">
        <animate attributeName="width" begin="0s" dur="1.3s" fill="freeze" calcMode="discrete"
          keyTimes="0;0.31;0.42;0.53;0.64;0.75;0.86;1" values="0;14;28;42;56;70;84;100" />
      </rect>
    </clipPath>
  </defs>

  <!-- terminal window -->
  <rect x="1" y="1" width="1198" height="438" rx="14" fill="#0a1216" stroke="#212629" stroke-width="2" />
  <path d="M1 15 a14 14 0 0 1 14 -14 H1185 a14 14 0 0 1 14 14 V42 H1 Z" fill="#0f191e" />
  <line x1="1" y1="42" x2="1199" y2="42" stroke="#212629" stroke-width="2" />
  <circle cx="26" cy="22" r="6.5" fill="#f72585" />
  <circle cx="48" cy="22" r="6.5" fill="#826aed" />
  <circle cx="70" cy="22" r="6.5" fill="#4cc9f0" />
  <text x="600" y="27" text-anchor="middle" class="mono" font-size="14" fill="#7a7a7a">sergio@noodles: ~</text>

  <!-- prompt: whoami -->
  <text x="48" y="98" class="mono" font-size="22" fill="#4cc9f0">~❯</text>
  <text x="86" y="98" class="mono" font-size="22" fill="#f2f2f2" clip-path="url(#typed-command)">whoami</text>

  <!-- output -->
  <g>
    <animate attributeName="opacity" begin="0s" dur="1.9s" fill="freeze" keyTimes="0;0.79;1" values="0;0;1" />
    <text x="48" y="168" class="mono" font-size="40" font-weight="700" fill="#f2f2f2">Hello, I'm</text>
    <text x="44" y="252" class="mono" font-size="88" font-weight="700" fill="#f72585" filter="url(#neon)">Sergio</text>
    <text x="48" y="306" class="mono" font-size="19" fill="#c4c4c4">Engineer and founder, rewiring 20 years</text>
    <text x="48" y="334" class="mono" font-size="19" fill="#c4c4c4">of habits for the AI era.</text>
  </g>

  <!-- idle prompt -->
  <g>
    <animate attributeName="opacity" begin="0s" dur="2.3s" fill="freeze" keyTimes="0;0.91;1" values="0;0;1" />
    <text x="48" y="394" class="mono" font-size="22" fill="#4cc9f0">~❯</text>
    <rect class="cursor" x="88" y="377" width="13" height="22" fill="#f2f2f2" />
  </g>

  <!-- noodle bowl -->
  <ellipse cx="930" cy="300" rx="230" ry="150" fill="url(#bowl-glow)" />

  <g transform="translate(0 4)">
    <path class="steam" d="M880 200 c -14 -16 14 -28 0 -44 c -14 -16 14 -28 0 -44" />
    <path class="steam s2" d="M935 196 c -14 -16 14 -28 0 -44 c -14 -16 14 -28 0 -44" />
    <path class="steam s3" d="M990 200 c -14 -16 14 -28 0 -44 c -14 -16 14 -28 0 -44" />
  </g>

  <!-- bowl back rim and broth -->
  <ellipse cx="930" cy="270" rx="140" ry="24" fill="#13232a" stroke="#4cc9f0" stroke-width="3" />
  <ellipse cx="930" cy="268" rx="128" ry="17" fill="#1c1426" />

  <!-- noodles resting in the broth -->
  <g clip-path="url(#broth-surface)">
    <g class="broth-noodle" fill="none" stroke="#f72585" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
      <path d="M800 262 q 15 -8 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0" />
      <path d="M790 270 q 15 -8 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0" opacity="0.7" />
      <path d="M805 278 q 15 -8 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0" opacity="0.5" />
    </g>
  </g>

  <!-- toppings -->
  <g transform="rotate(-8 878 262)">
    <ellipse cx="878" cy="262" rx="20" ry="11" fill="#f2f2f2" />
    <ellipse cx="880" cy="262" rx="9" ry="6" fill="#ffb703" />
  </g>
  <g>
    <ellipse cx="986" cy="262" rx="16" ry="9" fill="#f2f2f2" />
    <path d="M986 262 m -9 0 a 9 5 0 1 1 9 4 a 6 3.5 0 1 1 4 -3" fill="none" stroke="#f72585" stroke-width="2" />
  </g>
  <rect x="1022" y="222" width="26" height="44" rx="2" fill="#1f3b2d" stroke="#2d5a43" transform="rotate(14 1035 244)" />

  <!-- chopsticks lifting noodles -->
  <g clip-path="url(#above-broth)">
    <g class="lift">
      <g fill="none" stroke="url(#noodle-gradient)" stroke-width="4" stroke-linecap="round" filter="url(#soft-glow)">
        <path d="M904 214 c -14 12 12 20 -2 32 c -12 10 10 18 -2 30" />
        <path d="M912 218 c -12 12 14 20 0 32 c -12 10 12 18 0 30" />
        <path d="M920 220 c -10 12 14 20 2 32 c -10 10 12 18 2 30" />
        <path d="M896 212 c -12 14 10 20 -4 34 c -12 10 8 18 -4 30" />
      </g>
      <line x1="1062" y1="118" x2="890" y2="214" stroke="#d4a373" stroke-width="7" stroke-linecap="round" />
      <line x1="1072" y1="134" x2="900" y2="222" stroke="#c08552" stroke-width="7" stroke-linecap="round" />
    </g>
  </g>

  <!-- bowl front -->
  <path d="M790 270 Q 798 398 930 404 Q 1062 398 1070 270 A 140 24 0 0 1 790 270 Z" fill="#0f191e" stroke="#4cc9f0" stroke-width="3" stroke-linejoin="round" />
  <g clip-path="url(#bowl-body)">
    <path d="M780 322 q 12 -12 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0"
      fill="none" stroke="#f72585" stroke-width="2.5" opacity="0.85" />
    <path d="M780 340 q 12 -12 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0"
      fill="none" stroke="#826aed" stroke-width="2.5" opacity="0.6" />
  </g>
  <rect x="888" y="402" width="84" height="12" rx="4" fill="#0f191e" stroke="#4cc9f0" stroke-width="3" />

  <rect x="1" y="43" width="1198" height="396" rx="14" fill="url(#scanlines)" pointer-events="none" />
</svg>
